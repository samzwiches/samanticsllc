name: Validate portfolio case studies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate source files
        run: |
          node --check script.js
          node --check case-study.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser): pass
          for filename in ['index.html','at-the-in-gate.html','outside-inmates.html']:
              Parser().feed(Path(filename).read_text())
          css = Path('project-case-study.css').read_text()
          assert css.count('{') == css.count('}'), 'Unbalanced case study CSS'
          enhancements = Path('portfolio-enhancements.css').read_text()
          assert enhancements.count('{') == enhancements.count('}'), 'Unbalanced enhancement CSS'
          PY
      - name: Test pages in browser
        run: |
          python -m http.server 4173 > /tmp/samantics-server.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const path of ['at-the-in-gate.html', 'outside-inmates.html']) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto(`http://127.0.0.1:4173/${path}`, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForFunction(() => [...document.querySelectorAll('.carousel-slide img')].every(img => img.complete && img.naturalWidth > 0), null, { timeout: 90000 });
              const forbidden = await page.locator('a').evaluateAll(links => links.map(a => a.href).filter(href => /attheingate\.com|outside-inmates\.slduthie|workers\.dev/i.test(href)));
              if (forbidden.length) throw new Error(`Forbidden live links in ${path}: ${forbidden.join(', ')}`);
              const before = await page.locator('.carousel-slide.is-active img').getAttribute('alt');
              await page.locator('[data-carousel-next]').click();
              const after = await page.locator('.carousel-slide.is-active img').getAttribute('alt');
              if (!before || !after || before === after) throw new Error(`Carousel did not advance in ${path}`);
              if (errors.length) throw new Error(`Browser errors in ${path}: ${errors.join('; ')}`);
              await page.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/validate-portfolio-case-studies.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate-portfolio-case-studies.yml
          git commit -m "Remove temporary portfolio validation workflow"
          git push origin HEAD:${{ github.head_ref }}
